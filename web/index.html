<!doctype html>
<html lang="zh-CN" data-appearance="e"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#717951"><title>藏页 · 我的材料</title><link rel="stylesheet" href="/static/style.css?v=43"><script defer src="/static/video.js?v=43"></script><script defer src="/static/transcript.js?v=43"></script><script defer src="/static/knowledge.js?v=43"></script><script defer src="/static/app.js?v=43"></script></head>
<body><div class="app-shell">
<aside class="sidebar" aria-label="材料导航"><a class="brand" href="/" aria-label="藏页首页"><span class="brand-mark" data-icon="leaf"></span><span><strong>藏页</strong><small>把有价值的信息，留到未来的自己</small></span></a>
<div class="sidebar-library"><div class="navigation-stack"><div class="library-heading"><h2 id="libraryTitle">我的材料</h2><button id="expandLibrary" class="icon-button" aria-label="展开材料库" aria-expanded="false" title="展开材料库"><span data-icon="expand"></span></button></div><div class="library-switch" role="group" aria-label="材料层级"><button data-library="source" aria-pressed="true">原始收藏</button><button data-library="first" aria-pressed="false">第一层材料</button></div><nav id="sourceLibraryNav" class="library-nav" aria-label="原始收藏">
<button class="nav-item active" data-state="all" aria-current="page"><span data-icon="file"></span><span>未分流收藏</span><span class="nav-count" id="allCount">0</span></button>
<button class="nav-item" data-state="pending"><span data-icon="clock"></span><span>待处理</span><span class="nav-count" id="pendingCount">0</span></button>
<button class="nav-item" data-state="later" title="暂存，留待以后处理"><span data-icon="clock"></span><span>稍后整理</span><span class="nav-count" id="laterCount">0</span></button>
<button class="nav-item" data-state="review" title="按批注整理的结果集中在这里，等待本人审查"><span data-icon="sparkles"></span><span>整理待审</span><span class="nav-count" id="reviewCount">0</span></button>
<button class="nav-item" data-state="done"><span data-icon="check-circle"></span><span>已完成</span><span class="nav-count" id="doneCount">0</span></button>
<button class="nav-item" data-state="reference" title="资料供AI检索，不表示本人已消化"><span data-icon="book"></span><span>资料备查</span><span class="nav-count" id="referenceCount">0</span></button>
<button class="nav-item" data-state="source_archive"><span data-icon="file"></span><span>已分流原文</span><span class="nav-count" id="archiveCount">0</span></button>
<button class="nav-item" data-state="trash"><span data-icon="trash"></span><span>回收站</span><span class="nav-count" id="trashCount">0</span></button></nav>
<nav id="firstLibraryNav" class="library-nav" aria-label="第一层材料库" hidden><button class="nav-item" data-state="callable"><span data-icon="book"></span><span>调用资料</span><span class="nav-count" id="callableCount">0</span></button><button class="nav-item" data-state="digest"><span data-icon="bookmark"></span><span>消化暂存</span><span class="nav-count" id="digestCount">0</span></button></nav></div>
<section class="collection-pane" aria-label="材料列表"><header class="collection-header"><div class="collection-title"><h1 id="listTitle">最近收藏</h1><span id="listCount">0</span></div><div class="search-box"><span data-icon="search"></span><label class="sr-only" for="search">搜索全文</label><input id="search" type="search" placeholder="搜索这份材料库" autocomplete="off"></div>
<details class="library-filters"><summary><span>筛选材料</span><span data-icon="chevron"></span></summary><div><label class="sr-only" for="originFilter">按收集类型筛选</label><select id="originFilter"><option value="">全部类型</option><option value="favorite">我的收藏</option><option value="link">非收藏链接</option></select><label class="sr-only" for="captureFilter">按字幕与转录状态筛选</label><select id="captureFilter" class="capture-filter"><option value="">全部收集状态</option><option value="transcribed">已有字幕或转录</option><option value="missing">尚无字幕 / 未转录成功</option><option value="failed">转录失败</option><option value="uncertain">部分转录，需核查</option><option value="paused">已暂停</option></select><label class="sr-only" for="layerPhase">第一层处理状态</label><select id="layerPhase" hidden><option value="all">全部处理状态</option><option value="pending">第一层已存</option><option value="later">稍后加工</option><option value="review">AI 整理待审</option><option value="done">已归位</option><option value="trash">回收站</option></select><button id="syncBtn" class="text-button">导入收藏清单</button></div></details><button id="organizePromptBtn" class="text-button" hidden>整理提示词</button></header>
<div class="selection-entry"><span id="selectionTotal">0 条</span><label id="selectAllControl" hidden><input id="selectAll" type="checkbox"><span id="selectAllLabel">全选</span></label><span id="selectionCount" role="status" hidden>已选 0 条</span><button id="multiSelectBtn" class="text-button" aria-pressed="false" aria-controls="batchBar">多选</button></div>
<section id="batchBar" class="batch-bar" aria-label="批量操作" hidden>
  <div class="batch-actions"><button id="batchRetryBtn">重试收集</button><button id="batchTrashBtn" class="danger">移入回收站</button><button id="batchRestoreBtn" hidden>恢复</button><button id="batchPurgeBtn" class="danger" hidden>彻底删除</button></div>
  <div id="batchPurgePreview" class="batch-purge-preview" hidden><p id="batchPurgeLabel"></p><details><summary>所选材料</summary><ul id="batchPurgeNames"></ul></details><label class="sr-only" for="batchPurgeText">输入彻底删除确认</label><input id="batchPurgeText" placeholder="输入“彻底删除”" autocomplete="off"><div class="batch-actions"><button id="cancelBatchPurge">取消</button><button id="confirmBatchPurge" class="danger" disabled>确认删除</button></div></div>
  <details id="batchFailures" class="batch-failures" hidden><summary id="batchFailureSummary"></summary><ul id="batchFailureList"></ul></details>
</section>
<code id="layerFolderPath" class="layer-folder-path" hidden></code><div id="materialList" class="material-list" aria-live="polite"></div><footer class="collection-footer" id="listFooter">原文与历史均已保留</footer></section>
<div class="sidebar-bottom"><div class="utility-nav"><button id="settingsBtn" class="icon-button" title="设置" aria-label="设置"><span data-icon="settings"></span></button><button id="capabilitiesBtn" class="icon-button" title="平台能力" aria-label="平台能力"><span data-icon="info"></span></button><button id="jobsBtn" class="icon-button" title="任务记录" aria-label="任务记录"><span data-icon="history"></span></button><button id="storageBtn" class="icon-button" title="文件保存位置" aria-label="文件保存位置"><span data-icon="file"></span></button><a href="/design" target="_blank" rel="noopener" class="icon-button" title="界面参考" aria-label="界面参考"><span data-icon="book"></span></a></div><span class="local-status">数据保存在本机</span></div></div></aside>
<header class="workspace-toolbar"><nav class="platform-tabs" aria-label="按平台浏览材料"><button data-platform="" aria-pressed="true" class="active-platform">全部</button><button data-platform="bilibili" aria-pressed="false"><span data-platform-icon="bilibili"></span>B站</button><button data-platform="youtube" aria-pressed="false"><span data-platform-icon="youtube"></span>YouTube</button><button data-platform="douyin" aria-pressed="false"><span data-platform-icon="douyin"></span>抖音</button><button data-platform="x" aria-pressed="false"><span data-platform-icon="x"></span>X</button><button data-platform="heybox" aria-pressed="false"><span data-platform-icon="heybox"></span>小黑盒</button><button data-platform="xiaohongshu" aria-pressed="false"><span data-platform-icon="xiaohongshu"></span>小红书</button><button data-platform="web" aria-pressed="false"><span data-platform-icon="web"></span>网页</button></nav><select id="platformFilter" hidden aria-label="选择平台材料库"><option value="">全部平台</option><option value="bilibili">B站</option><option value="youtube">YouTube</option><option value="douyin">抖音</option><option value="x">X</option><option value="heybox">小黑盒</option><option value="xiaohongshu">小红书</option><option value="web">其他网页</option></select><div class="import-actions"><button id="addBtn" class="collect-button"><span data-icon="plus"></span><span>粘贴链接</span></button><button id="xConnectBtn" class="primary connection-button" title="登录平台并导入收藏"><span data-icon="download"></span><span>导入收藏</span></button></div></header>
<button id="toggleSidebar" class="sidebar-handle" aria-expanded="true" aria-controls="materialList" aria-label="收起材料栏"><span data-icon="back"></span></button>
<div class="reading-stage"><div id="toast" role="status" aria-live="polite" hidden></div><nav id="topicBar" class="topic-bar" aria-label="按内容主题浏览" title="本机规则粗分，可在材料中改类"></nav><main class="reading-pane" id="readingPane"><article id="detail"><div class="empty"><span class="empty-mark" data-icon="leaf"></span><p>我的材料库</p><h2>从一条原文开始，<br>留下自己的理解。</h2><p>打开左边的材料阅读、整理，<br>也可以收藏一条新的链接。</p><button id="emptyCollect" class="primary">收集一条材料</button></div></article></main>
<nav id="processingDock" class="processing-dock" aria-label="材料处理方式" hidden></nav>
<section id="processingPanel" class="processing-panel" aria-label="材料处理面板" aria-hidden="true" inert><div class="processing-panel-head"><h2 id="processingTitle">我的理解</h2><button id="closeProcessing" class="icon-button" aria-label="收起处理面板"><span data-icon="close"></span></button></div><div id="processingPanelBody"></div></section></div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-button" aria-label="关闭对话框"><span data-icon="close"></span></button></div><div id="dialogFeedback" role="status" aria-live="polite" hidden></div><div id="dialogBody"></div></dialog></body></html>
